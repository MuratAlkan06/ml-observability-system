# Postgres — the only stateful component that survives a pod restart (D20).
#
# Compose source of truth: the `postgres` service in docker-compose.yml.
---
# The one PersistentVolumeClaim in the stack. k3s ships `local-path` as its
# default StorageClass; it is named explicitly here so the manifest states what
# it binds to rather than inheriting whichever class a cluster happens to mark
# default. The volume is node-local by construction — this is a single-node
# cluster and the data is demo data, not a durability claim (D20).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: mlobs
  labels:
    app: postgres
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: mlobs
  labels:
    app: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: mlobs
  labels:
    app: postgres
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the replacement pod would otherwise try to
  # attach the same ReadWriteOnce volume while the outgoing pod still holds it,
  # and the rollout would sit there until the timeout (D22).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: mlobs
            - name: POSTGRES_DB
              value: mlobs
            # Compose threaded this from .env with `:?` so a weak default could
            # not silently ship (security review M1). The k8s equivalent is a
            # required Secret key: no `optional: true`, so the kubelet refuses
            # to start the container if the key is missing.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlobs-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          # Compose healthcheck, transcribed. There is no startup probe here
          # because initdb on an empty volume is fast and the readiness probe's
          # own failureThreshold already covers it.
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "mlobs", "-d", "mlobs"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        # Generated by apply.sh from sql/init.sql plus every sql/migrations/*.sql,
        # with ordering baked into the key names. The postgres entrypoint runs
        # this directory in lexical order, so a bare `002_shadow.sql` would sort
        # ahead of `init.sql` and its ALTER TABLE would hit a drift_runs table
        # that does not exist yet.
        - name: initdb
          configMap:
            name: postgres-initdb
