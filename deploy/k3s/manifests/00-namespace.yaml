# Namespace for the whole stack (Phase 2 P2a, D17).
#
# Every object in this directory names `namespace: mlobs` explicitly rather than
# relying on the caller's current context: `kubectl apply -f manifests/` must
# land in the same place no matter which namespace the operator happens to be
# sitting in. apply.sh applies this file first, because the Secret and the
# ConfigMaps it generates cannot be created into a namespace that is not there
# yet.
#
# One namespace, not one per service: Prometheus resolves its targets by the
# short DNS name (`api:8000`, `drift-shadow:9109`) exactly as it did under
# Compose, and short names only resolve within a namespace. Splitting the stack
# would force `<svc>.<ns>.svc` targets and edit the frozen scrape config (D21).
apiVersion: v1
kind: Namespace
metadata:
  name: mlobs
  labels:
    app.kubernetes.io/part-of: mlobs
