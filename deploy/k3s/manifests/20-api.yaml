# Inference API — docs/PLAN.md §2.
#
# Compose source of truth: the `api` service in docker-compose.yml.
#
# Since Phase 3 O2 this file holds the api's two Services and no workload. The
# api Deployment, deployment/api, is created or adopted and then owned by the
# operator through the ServingDeployment in 40-servingdeployment.yaml, and so is
# the canary Deployment, deployment/api-canary (D31, D32). The shape the
# operator creates, with the reasoning behind each field that used to live
# here, is operator/internal/controller/testdata/api-deployment.yaml; the
# operator's tests pin its Deployment builder to that file.
#
# This is one of the two workloads a human reaches from outside the cluster.
# It used to publish hostPort 8000; it is now published by a NodePort Service
# on k3s's exact 8000-8000 node-port range (D34, and the D19 erratum of O2).
# The port a stranger following the README curls is still 8000, the EC2
# security group is untouched, and unlike a hostPort a Service can put the
# stable and the canary behind one port on one node.
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: mlobs
  labels:
    app: api
spec:
  # k3s runs with --service-node-port-range=8000-8000 (the three pin sites are
  # listed in docs/K3S.md), so 8000 is the only node port this Service could
  # be given. apply.sh dry-runs this object server-side before it changes
  # anything else, and stops if the cluster's range does not admit it.
  type: NodePort
  # A NodePort connection is served by an api pod on the node it arrived at,
  # with the client's source address kept. On a one-node cluster that is every
  # api pod.
  externalTrafficPolicy: Local
  # app: api selects the stable's pods and the canary's alike, so an open
  # canary window splits traffic by replica ratio, per connection: a
  # keep-alive client stays on one pod (D34).
  selector:
    app: api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: api-canary
  namespace: mlobs
  labels:
    app: api
    role: canary
spec:
  # The canary's own address, so Prometheus scrapes it apart from the stable:
  # job api_canary in prometheus/prometheus.yml targets api-canary:8000 (D34,
  # D21). It selects the canary's pods only. It is a static manifest rather
  # than an object the operator creates, because the operator's Role holds no
  # grant on Services (D33). Outside a window it has no endpoints and the
  # api_canary target reads down, which is what smoke.sh expects of the
  # steady state.
  type: ClusterIP
  selector:
    app: api
    role: canary
  ports:
    - name: http
      port: 8000
      targetPort: 8000
