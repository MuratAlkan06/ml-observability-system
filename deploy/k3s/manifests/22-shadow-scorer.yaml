# Shadow scorer — v1.1 Slice A (D3/D4).
#
# Compose source of truth: the `shadow-scorer` service in docker-compose.yml.
#
# StatefulSet for the same reason as the consumer (D22): the scorer registers as
# `shadow_scorer-<hostname>` in its own consumer group, so a stable pod name is
# a stable identity. Its group starts at "$", which makes a lost identity worse
# than the consumer's — anything queued against the old name is never replayed
# from the stream head.
---
apiVersion: v1
kind: Service
metadata:
  name: shadow-scorer
  namespace: mlobs
  labels:
    app: shadow-scorer
spec:
  type: ClusterIP
  selector:
    app: shadow-scorer
  ports:
    - name: metrics
      port: 9110
      targetPort: 9110
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: shadow-scorer
  namespace: mlobs
  labels:
    app: shadow-scorer
spec:
  serviceName: shadow-scorer
  # No replica count here, on purpose: from Phase 3 O2 the operator owns this
  # StatefulSet's scale. It holds it at 1, and at 0 while a canary window is
  # open, writing only through the scale subresource (D37 and its O2 addendum).
  # A count in this file would reset the operator's scale on every pipeline
  # apply. The manual `kubectl scale` switch this comment once sanctioned for
  # the latency A/B is retired: a hand scale is put back on the operator's
  # next reconcile.
  selector:
    matchLabels:
      app: shadow-scorer
  template:
    metadata:
      labels:
        app: shadow-scorer
    spec:
      initContainers:
        - name: pg-ready
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -U mlobs; do sleep 2; done"]
          resources:
            requests:
              memory: 16Mi
        - name: redis-ready
          image: redis:7.4-alpine
          command: ["sh", "-c", "until redis-cli -h redis ping; do sleep 2; done"]
          resources:
            requests:
              memory: 16Mi
      containers:
        - name: shadow-scorer
          image: IMAGE_PREFIX/mlobs-shadow-scorer:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9110
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlobs-secrets
                  key: POSTGRES_PASSWORD
            - name: MLOBS_SHADOW_REDIS_URL
              value: redis://redis:6379/0
            - name: MLOBS_SHADOW_PG_DSN
              value: postgresql://mlobs:$(POSTGRES_PASSWORD)@postgres:5432/mlobs
            - name: MLOBS_SHADOW_METRICS_PORT
              value: "9110"
          # Safe as a liveness probe despite the slow model load: __main__ calls
          # start_http_server BEFORE load_model, so :9110 is listening while the
          # candidate model is still warming.
          livenessProbe:
            tcpSocket:
              port: 9110
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          # v1.1 D8, transcribed from Compose `mem_limit: 768m`. The request is
          # deliberately well under the limit: the steady-state footprint is the
          # loaded MiniLM plus one batch, and reserving the whole ceiling would
          # crowd the api pod off a 4GB node for no reason.
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 768Mi
