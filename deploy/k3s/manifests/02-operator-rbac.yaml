# Operator identity and RBAC — Phase 3 O0 (docs/PLAN.md D33).
#
# One ServiceAccount, one Role and the RoleBinding between them, all named
# `operator` and all in mlobs. No ClusterRole and no ClusterRoleBinding: the
# operator works only inside this namespace and holds no write on CRDs, and its
# metrics bind to localhost with authn/authz off in v0 — the one scaffold
# feature that would have needed a cluster-wide grant (D33). Nothing runs as
# this identity yet; the operator's own Deployment lands in a later slice.
#
# Beside the Deployment grant, the Role reads the namespace's StatefulSets and
# may patch one subresource of one of them: the scale of shadow-scorer, which
# the operator pauses for a canary window (the D33 addendum of O2). RBAC
# cannot name-scope list and watch, so the read covers both StatefulSets; the
# one write is that replica count, and the controller only ever sends 0 or 1.
# `make -C operator verify-manifests` also fails if this file ever references
# a ClusterRole.
#
# The ServiceAccount and RoleBinding above the marker line are hand-written.
# The Role below it is controller-gen's output, verbatim, from the
# +kubebuilder:rbac markers in operator/internal/controller/. Change the
# markers and run `make -C operator manifests`, never edit the Role here:
# `make -C operator verify-manifests` (CI job OperatorManifestSync) fails on any
# difference.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: operator
  namespace: mlobs
  labels:
    app: operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: operator
  namespace: mlobs
  labels:
    app: operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: operator
subjects:
  - kind: ServiceAccount
    name: operator
    namespace: mlobs
# --- generated by controller-gen below this line; do not edit ---
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: operator
  namespace: mlobs
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - statefulsets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resourceNames:
  - shadow-scorer
  resources:
  - statefulsets/scale
  verbs:
  - patch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - serving.mlobs.dev
  resources:
  - servingdeployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - serving.mlobs.dev
  resources:
  - servingdeployments/finalizers
  verbs:
  - update
- apiGroups:
  - serving.mlobs.dev
  resources:
  - servingdeployments/status
  verbs:
  - get
  - patch
  - update
