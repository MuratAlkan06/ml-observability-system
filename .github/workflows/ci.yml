name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Phase 2 P2a: K3sSmoke is expensive and only runs for pull requests that
  # touch the paths it covers. Manual dispatch is the escape hatch for running
  # it against a branch anyway.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - run: pip install -r requirements/dev.txt
      - run: ruff check .

  Tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - run: pip install -r requirements/dev.txt
      # Install light service deps for the unit suite, excluding the heavy ML
      # wheels (torch/transformers/tokenizers) — tests mock the model. Loops over
      # every requirements/*.txt so sibling slices' files are picked up too.
      - name: Install light service deps (exclude heavy ML wheels)
        run: |
          for f in requirements/*.txt; do
            [ "$f" = "requirements/dev.txt" ] && continue
            grep -vE '^\s*(#|$)' "$f" | grep -viE '^(torch|transformers|tokenizers)\b' > /tmp/reqs.txt || true
            [ -s /tmp/reqs.txt ] && pip install -r /tmp/reqs.txt
          done
      - run: pytest

  Drift-Integration-Tests:
    name: Drift integration tests
    # S3: drift integration tests against a throwaway postgres container.
    # REQUIRE_DRIFT_INTEGRATION=1 turns the tests' local-convenience skips
    # (missing psycopg/docker) into hard failures so they cannot silently skip.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/dev.txt
            requirements/drift.txt
      - run: pip install -r requirements/dev.txt -r requirements/drift.txt
      - run: pytest tests/drift -v -rs
        env:
          REQUIRE_DRIFT_INTEGRATION: "1"
  DockerBuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build api image
        run: docker build -f docker/api.Dockerfile -t mlobs-api:ci .
      - name: Assert image size < 2GB
        run: |
          bytes=$(docker image inspect mlobs-api:ci --format '{{.Size}}')
          echo "api image size: $bytes bytes"
          test "$bytes" -lt 2147483648
      - name: pip check inside image
        run: docker run --rm mlobs-api:ci pip check

  ShadowBuild:
    name: Shadow scorer image build
    # v1.1 Slice A: build the shadow image (bakes the candidate model + runs the
    # label-map sanity assertion), assert size < 2GB, pip check inside — mirrors
    # the DockerBuild job above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build shadow-scorer image
        run: docker build -f docker/shadow_scorer.Dockerfile -t mlobs-shadow:ci .
      - name: Assert image size < 2GB
        run: |
          bytes=$(docker image inspect mlobs-shadow:ci --format '{{.Size}}')
          echo "shadow image size: $bytes bytes"
          test "$bytes" -lt 2147483648
      - name: pip check inside image
        run: docker run --rm mlobs-shadow:ci pip check

  DocsGate:
    name: Docs & naming gate
    # Phase 2 P0: mechanical enforcement of PRINCIPLES.md — banned overclaim
    # vocabulary (§6), the exactly-once *effect* wording (§6), the model_id ban
    # (§1 Law 1), the README link (§9), and no AI-attribution trailers in the
    # PR's commit messages (§6). PRINCIPLES.md itself and this workflow file are
    # outside the swept paths by design: both quote the banned strings.
    # Every sweep checks grep's exit status explicitly — a bare `! grep` would
    # read a grep error (status 2) as "no match" and pass silently.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # infra/ joined the swept paths in Phase 2 P1: an IaC directory is exactly
      # where "production-grade" creeps into a comment, and the runbook there
      # makes cost and capability claims a stranger will check. operator/
      # joined in Phase 3 O0 (D35): its doc comments become the CRD's field
      # descriptions, which ship to the cluster as written.
      - name: No banned overclaim vocabulary
        run: |
          status=0
          hits=$(grep -rIniE 'champion|challenger|\bdistributed\b|production-ready|production-grade' README.md docs/ src/ tests/ infra/ operator/) || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::banned overclaim vocabulary (PRINCIPLES.md §6):"
            echo "$hits"
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            echo "::error::grep exited with status $status"
            exit 1
          fi
          echo "ok: no banned overclaim vocabulary"

      - name: README says exactly-once effect, never bare exactly-once
        run: |
          status=0
          hits=$(grep -niP 'exactly-once(?![ -]?effect)' README.md) || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::bare 'exactly-once' in README.md — only the exactly-once effect is true (PRINCIPLES.md §6):"
            echo "$hits"
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            echo "::error::grep exited with status $status"
            exit 1
          fi
          echo "ok: no bare exactly-once claim"

      - name: No model_id in src
        run: |
          status=0
          hits=$(grep -rInP '\bmodel_id\b' src) || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::model_id is not a thing here — use model_name / model_revision / model_version (PRINCIPLES.md §1 Law 1):"
            echo "$hits"
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            echo "::error::grep exited with status $status"
            exit 1
          fi
          echo "ok: no model_id"

      - name: README links PRINCIPLES.md
        run: |
          if ! grep -q 'PRINCIPLES.md' README.md; then
            echo "::error::README.md must link PRINCIPLES.md (PRINCIPLES.md §9)"
            exit 1
          fi
          echo "ok: README links PRINCIPLES.md"

      - name: No AI-attribution trailers in PR commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git log --format='%B' "origin/${BASE_REF}..HEAD" > "$RUNNER_TEMP/commit-messages.txt"
          status=0
          hits=$(grep -niE 'co-authored-by:.*(claude|gpt|copilot|gemini)|generated with[^a-z0-9]*(claude|chatgpt|copilot)' "$RUNNER_TEMP/commit-messages.txt") || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::AI-attribution trailer in a commit message on this PR (PRINCIPLES.md §6):"
            echo "$hits"
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            echo "::error::grep exited with status $status"
            exit 1
          fi
          echo "ok: no AI-attribution trailers"

  TerraformValidate:
    name: Terraform validate
    # Phase 2 P1: credential-less checks on the infra/ec2 root — formatting,
    # provider resolution against the committed .terraform.lock.hcl, and
    # configuration validity. `init -backend=false` skips the S3 backend
    # entirely, so this job needs no AWS access and therefore runs everywhere
    # TerraformPlan cannot: fork pull requests and Dependabot branches included.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.14.0"
      - name: terraform fmt
        run: terraform fmt -check -recursive
      - name: terraform init (no backend)
        run: terraform -chdir=infra/ec2 init -backend=false
      - name: terraform validate
        run: terraform -chdir=infra/ec2 validate

  TerraformPlan:
    name: Terraform plan
    # Phase 2 P1: the real plan against S3 remote state, authenticated by
    # GitHub OIDC — this repository holds no long-lived AWS keys. The role is
    # read-only and the plan runs with -lock=false, so the job can neither
    # write state nor leave a lock behind.
    #
    # Gated to same-repo events: a fork's token, and Dependabot's, cannot mint
    # an OIDC identity matching the two subjects the role trusts, so the job
    # would fail at assume-role for reasons unrelated to the change under test.
    # TerraformValidate still covers those cases.
    #
    # The Dependabot half of that gate reads `pull_request.user.login`, not
    # `github.actor`, because `github.actor` is whoever caused the current run
    # and not who opened the pull request. Clicking "Re-run jobs" on a
    # Dependabot PR sets it to the human who clicked, the `!=` then passes, and
    # the job un-skips into an assume-role failure on a branch whose token was
    # never going to work. `pull_request.user.login` is a property of the pull
    # request itself, so it stays `dependabot[bot]` across every re-run.
    #
    # Actions are SHA-pinned in this job specifically. It is the only job that
    # holds an AWS session, so a hijacked mutable tag here would be an account
    # problem rather than a CI problem; elsewhere in this file tag pins plus
    # Dependabot remain the right trade.
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    # Naming any permission here replaces the whole inherited set, so
    # contents: read must be restated alongside id-token: write — without it
    # actions/checkout cannot read the repository.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # An exact patch, deliberately, in this job only. A range lets the
          # action pick whichever 1.14.x is newest at run time, so the binary
          # that runs with the AWS session could change with no commit here —
          # the one input the SHA pins above leave floating. Bumps are manual.
          # TerraformValidate, which holds no credentials, keeps the range.
          terraform_version: "1.14.9"
          # The action's default wrapper maps terraform's exit 2 (changes
          # pending) to 0, which silently defeated the case dispatch below
          # from P1 until P2c (see the D13 erratum in docs/PLAN.md).
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: arn:aws:iam::601548053958:role/mlobs-tf-plan
          aws-region: us-west-2
      - name: terraform init
        run: terraform -chdir=infra/ec2 init -input=false
      # The SSH CIDR reaches the plan as a secret so that GitHub masks it in
      # this public log: Terraform's own `sensitive` marking does not cover the
      # security group's API-read `ingress` attribute. See infra/README.md.
      # Masking is the second line of defence here, not the first — the plan
      # body goes to a file that is never echoed.
      #
      # `-detailed-exitcode` returns 0 for no changes, 1 for a failed plan and 2
      # for a plan with changes. Only 2 is ambiguous, and its meaning depends on
      # the event. On a pull request a non-empty plan is the change under review,
      # so it is reported and passes. On a push to main the config has already
      # been merged, so the same exit code means the config and the account have
      # diverged — that is drift, and catching it is why this job runs on main
      # at all, so there it fails.
      - name: terraform plan
        run: |
          # `|| code=$?` rather than `; code=$?`: the default shell is `bash -e`,
          # under which a bare failing command aborts the step before its status
          # can be captured, and the summary below would never run.
          code=0
          terraform -chdir=infra/ec2 plan -input=false -lock=false -no-color \
            -detailed-exitcode -out=tf.tfplan > plan.txt 2>&1 || code=$?
          # plan.txt is never printed: aws_security_group.app's API-read `ingress`
          # attribute carries the SSH CIDR and is not sensitive-marked (empirically
          # confirmed: a plan with a dummy variable value still printed the real CIDR).
          rc=0
          case "$code" in
            0)
              echo "ok: plan is a no-op"
              ;;
            1)
              echo "::error::plan failed (exit 1)"
              rc=1
              ;;
            2)
              if [ "$EVENT_NAME" = "push" ]; then
                echo "::error::config/reality drift detected on main — addresses and actions only; re-run locally for values"
                rc=1
              else
                echo "::notice::plan has changes (expected for infra PRs) — addresses and actions only"
              fi
              terraform -chdir=infra/ec2 show -json tf.tfplan \
                | jq -r '.resource_changes[] | select(.change.actions != ["no-op"]) | "\(.address) \(.change.actions|join(","))"' || true
              ;;
            *)
              echo "::error::terraform plan returned unexpected exit code $code"
              rc=1
              ;;
          esac
          exit "$rc"
        env:
          # Interpolated into the environment rather than into the script body:
          # an expression expanded inline becomes shell source, so a value
          # containing quotes would change the script's meaning rather than a
          # variable's value.
          EVENT_NAME: ${{ github.event_name }}
          TF_VAR_ssh_ingress_cidr: ${{ secrets.SSH_INGRESS_CIDR }}

  K3sPaths:
    name: k3s path filter
    # GitHub applies `paths:` filters per workflow, never per job, and the k3s
    # rehearsal below costs some fifteen minutes of runner time — too much to
    # spend on a pull request that edits a docstring. This one-minute job is the
    # per-job filter K3sSmoke gates on. Pushes to main and manual dispatches
    # always run; only pull requests are filtered. operator/ joined the filter
    # in Phase 3 O0: the operator's end-to-end tests run on k3d, not on kind
    # (D35) — since O2 in OperatorE2E and, with the stack, in K3sSmoke, both
    # gated here. prometheus/ joined in O3: apply.sh mounts
    # prometheus/prometheus.yml as the scrape config and smoke.sh reads its job
    # list, so a change there alone changes what both rehearsals deploy and
    # assert. deploy/helm/ joined `run` in Phase 3 H1 (D38): OperatorE2E
    # installs the operator from that chart too. The second output,
    # `rehearsal`, gates RollbackRehearsal on the same paths but deploy/helm/,
    # which that job never installs, and on this file, where it is defined.
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
      rehearsal: ${{ steps.filter.outputs.rehearsal }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "rehearsal=true" >> "$GITHUB_OUTPUT"
            echo "ok: event ${EVENT_NAME} always runs K3sSmoke and RollbackRehearsal"
            exit 0
          fi
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          # Same explicit-status discipline as DocsGate: a bare `! grep` would
          # read a grep error (status 2) as "nothing matched" and skip the job.
          status=0
          printf '%s\n' "$changed" | grep -qE '^(deploy/k3s/|deploy/helm/|docker/|operator/|prometheus/)' || status=$?
          case "$status" in
            0)
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "ok: deploy/k3s, deploy/helm, docker, operator or prometheus paths changed — K3sSmoke will run"
              ;;
            1)
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "ok: no deploy/k3s, deploy/helm, docker, operator or prometheus changes — K3sSmoke skipped"
              ;;
            *)
              echo "::error::grep exited with status $status"
              exit 1
              ;;
          esac
          status=0
          printf '%s\n' "$changed" \
            | grep -qE '^(deploy/k3s/|docker/|operator/|prometheus/|\.github/workflows/ci\.yml$)' || status=$?
          case "$status" in
            0)
              echo "rehearsal=true" >> "$GITHUB_OUTPUT"
              echo "ok: deploy/k3s, docker, operator, prometheus or ci.yml changed — RollbackRehearsal will run"
              ;;
            1)
              echo "rehearsal=false" >> "$GITHUB_OUTPUT"
              echo "ok: none of deploy/k3s, docker, operator, prometheus or ci.yml changed — RollbackRehearsal skipped"
              ;;
            *)
              echo "::error::grep exited with status $status"
              exit 1
              ;;
          esac

  K3sSmoke:
    name: k3s smoke (k3d)
    # Phase 2 P2a rehearsal. Builds the four service images, imports them into a
    # pinned k3d cluster, deploys with deploy/k3s/apply.sh and asserts the stack
    # answers — then does it a second time with different image refs and an
    # edited scrape config, because a deploy pipeline that only works on an
    # empty cluster is not a deploy pipeline.
    #
    # Since Phase 3 O2 it builds the operator too, and takes the stack through
    # both of D37's states: steady after the first deploy; a canary window
    # opened by hand, as on the host, with smoke.sh green in it; a third state
    # put together by hand, which smoke.sh must reject; and the second deploy
    # run while the window is open, which must close it on apply.sh's fixed
    # line and end green in the steady state. The canary is the api image this
    # job already builds, under a second 40-hex tag (the D35 deviation of O2).
    #
    # This job holds no credentials of any kind: the images are built locally
    # and never pushed, and nothing here touches AWS. That is why it takes
    # `contents: read` and tag-pinned actions rather than the SHA pins
    # TerraformPlan uses — there is no session here worth hijacking.
    needs: K3sPaths
    if: needs.K3sPaths.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Its own group, separate from the workflow-wide one: cancelling a k3d
    # rehearsal mid-flight should not depend on what the lint job is doing.
    concurrency:
      group: k3s-smoke-${{ github.ref }}
      cancel-in-progress: true
    env:
      K3D_VERSION: v5.9.0
      # Pinned to the k3s the EC2 host runs (D19). k3s publishes `v1.36.4+k3s1`;
      # the container tag spells the build metadata with a dash.
      K3S_IMAGE: rancher/k3s:v1.36.4-k3s1
      CLUSTER_NAME: mlobs-ci
      # The deploy tag. apply.sh renders it into the ServingDeployment's
      # spec.imageTag, whose schema admits a full 40-character commit SHA and
      # nothing else, so the tags here are all of that shape. The redeploy and
      # the canary get tags of their own on the same builds, derived below.
      DEPLOY_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Derive the redeploy and canary tags
        # Two more 40-hex tags, stable per commit and distinct from it and
        # from each other; they name local builds and are never pushed.
        run: |
          redeploy_tag="$(printf '%s' "${DEPLOY_TAG}-redeploy" | sha1sum | cut -c1-40)"
          canary_tag="$(printf '%s' "${DEPLOY_TAG}-canary" | sha1sum | cut -c1-40)"
          echo "REDEPLOY_TAG=${redeploy_tag}" >> "$GITHUB_ENV"
          echo "CANARY_TAG=${canary_tag}" >> "$GITHUB_ENV"
          echo "ok: deploy ${DEPLOY_TAG}, redeploy ${redeploy_tag}, canary ${canary_tag}"

      - name: Reclaim runner disk
        # The api and shadow-scorer images each bake a torch install and a model
        # snapshot, and every image is stored twice — once by the docker daemon
        # that builds it and again in the cluster's containerd after
        # `k3d image import`. The hosted runner ships several GB of toolchains
        # this job will never touch; deleting them buys the headroom.
        # The hosted tool cache is deliberately left alone: smoke.sh needs a
        # python3, and there is no reason to go near the interpreters.
        run: |
          before=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          sudo rm -rf /usr/local/lib/android       # Android SDK and NDK
          sudo rm -rf /usr/share/dotnet            # .NET SDK
          sudo rm -rf /opt/ghc /usr/local/.ghcup   # Haskell: GHC, Stack, ghcup
          sudo rm -rf /usr/share/swift             # Swift toolchain
          sudo rm -rf /usr/local/share/powershell  # PowerShell
          after=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "ok: reclaimed $((after - before))G, ${after}G now free"

      - name: Assert free disk
        run: |
          avail=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          if [ "$avail" -lt 8 ]; then
            echo "::error::only ${avail}G free — the five image builds need more"
            exit 1
          fi
          echo "ok: ${avail}G free (>= 8G)"

      - name: Install k3d
        # A pinned release asset rather than `curl https://.../install.sh | bash`:
        # the install script is served from a moving branch, this URL is
        # immutable, and the installer offers nothing else this job wants.
        run: |
          curl -fsSL -o /tmp/k3d \
            "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          sudo install -m 0755 /tmp/k3d /usr/local/bin/k3d
          k3d version

      - name: Load br_netfilter on the runner
        # Traffic between two pods on the node's bridge, a reply from a
        # Service's endpoint included, passes through kube-proxy's rules only
        # when br_netfilter is loaded; without it no pod reaches a Service,
        # cluster DNS first. On a real host k3s loads the module itself at
        # startup. Inside a k3d node it cannot ("Failed to load kernel module
        # br_netfilter with modprobe"), and with the network-policy controller
        # off, the other half of the D34 pair, nothing else loads it on the
        # hosted runner's kernel: the first run of this job stalled every pod
        # in Init on exactly that. The default-range e2e cluster, controller
        # on, resolves Services on the same runners without this step. This
        # loads the module where k3s would have, on the machine that owns the
        # kernel.
        run: |
          sudo modprobe br_netfilter
          test -e /proc/sys/net/bridge/bridge-nf-call-iptables
          echo "ok: br_netfilter loaded; bridge-nf-call-iptables=$(cat /proc/sys/net/bridge/bridge-nf-call-iptables)"

      - name: Create k3d cluster
        # traefik and servicelb are disabled to match the host (D19): an
        # ingress controller the manifests never reference would only be one
        # more thing holding :80. The node-port range is pinned to exactly
        # 8000-8000, one of D34's three pin sites (docs/K3S.md): the api is a
        # NodePort Service on 8000, which a default range refuses, and
        # apply.sh's preflight stops on a cluster without it. The range and
        # --disable-network-policy are one atomic pair (the D34 erratum of
        # O2): k3s's network-policy controller refuses a single-port range
        # and crash-loops the server, so neither line goes in without the
        # other. The two -p mappings publish the api's node port and
        # grafana's hostPort off the server node's container, which is what
        # lets smoke.sh curl 127.0.0.1:8000 and :3000 here exactly as it does
        # on the EC2 box.
        run: |
          k3d cluster create "$CLUSTER_NAME" \
            --image "$K3S_IMAGE" \
            -p '8000:8000@server:0' \
            -p '3000:3000@server:0' \
            --k3s-arg '--disable=traefik@server:*' \
            --k3s-arg '--disable=servicelb@server:*' \
            --k3s-arg '--disable=metrics-server@server:*' \
            --k3s-arg '--service-node-port-range=8000-8000@server:*' \
            --k3s-arg '--disable-network-policy@server:*' \
            --wait \
            --timeout 300s
          kubectl wait --for=condition=Ready node --all --timeout=120s
          kubectl get nodes -o wide

      - name: Cluster DNS and Service routing answer
        # Every workload's init container finds its dependency by Service
        # name, so a pod that cannot resolve and reach a Service leaves the
        # whole stack in Init until apply.sh's bounds run out, minutes later
        # and far from the cause. A throwaway pod checks both here, before the
        # image builds: it resolves the API server's Service by name and opens
        # its ClusterIP port.
        run: |
          kubectl -n kube-system rollout status deployment/coredns --timeout=180s
          kubectl run net-probe --namespace default --image=busybox:1.37 --restart=Never \
            --command -- sh -c 'nslookup kubernetes.default.svc.cluster.local && nc -z -w 5 kubernetes.default.svc.cluster.local 443'
          if ! kubectl wait --namespace default pod/net-probe \
                --for=jsonpath='{.status.phase}'=Succeeded --timeout=120s; then
            kubectl --namespace default logs pod/net-probe || true
            kubectl -n kube-system get pods -o wide || true
            kubectl -n kube-system logs deployment/coredns --tail=40 || true
            docker exec "k3d-${CLUSTER_NAME}-server-0" iptables -S FORWARD || true
            docker logs "k3d-${CLUSTER_NAME}-server-0" 2>&1 \
              | grep -iE 'error|fail|netpol|network polic|flannel|proxy' | tail -60 || true
            echo "::error::a pod could not resolve and reach a Service by name"
            exit 1
          fi
          kubectl --namespace default logs pod/net-probe
          kubectl --namespace default delete pod/net-probe --wait=false
          echo "ok: cluster DNS resolves Service names and Service routing reaches the endpoint"

      - name: Build service images
        run: |
          docker build -f docker/api.Dockerfile           -t "mlobs-api:${DEPLOY_TAG}" .
          docker build -f docker/consumer.Dockerfile      -t "mlobs-consumer:${DEPLOY_TAG}" .
          docker build -f docker/drift.Dockerfile         -t "mlobs-drift:${DEPLOY_TAG}" .
          docker build -f docker/shadow_scorer.Dockerfile -t "mlobs-shadow-scorer:${DEPLOY_TAG}" .
          docker build -t "mlobs-operator:${DEPLOY_TAG}" operator
          # The canary: the api build above under its own tag, not a second
          # torch build (the D35 deviation of O2).
          docker tag "mlobs-api:${DEPLOY_TAG}" "mlobs-api:${CANARY_TAG}"
          docker images --filter reference='mlobs-*' \
            --format '{{.Repository}}:{{.Tag}} {{.Size}}'

      - name: Prune build cache
        run: |
          docker builder prune -f
          df -h /

      - name: Import images into the cluster
        # containerd normalises a bare `name:tag` to `docker.io/library/name:tag`
        # on import, which is exactly why apply.sh is invoked below with
        # IMAGE_PREFIX=docker.io/library. The manifests set
        # imagePullPolicy: IfNotPresent so the kubelet uses what is already there
        # instead of chasing a registry that has never heard of these tags.
        run: |
          k3d image import -c "$CLUSTER_NAME" \
            "mlobs-api:${DEPLOY_TAG}" "mlobs-api:${CANARY_TAG}" \
            "mlobs-consumer:${DEPLOY_TAG}" "mlobs-drift:${DEPLOY_TAG}" \
            "mlobs-shadow-scorer:${DEPLOY_TAG}" "mlobs-operator:${DEPLOY_TAG}"
          docker exec "k3d-${CLUSTER_NAME}-server-0" k3s crictl images | grep mlobs || true

      - name: Synthesize a test .env
        # Dummy values, and not secrets in any sense: this cluster is deleted
        # when the job ends and was never reachable from outside the runner.
        # GF_ADMIN_USER is left out on purpose so apply.sh exercises its
        # mlobsadmin default-injection branch rather than the pass-through one.
        run: |
          cat > .env <<'EOF'
          POSTGRES_PASSWORD=ci-postgres-password
          GF_ADMIN_PASSWORD=ci-grafana-password
          SLACK_WEBHOOK_URL=
          EOF
          echo "ok: test .env written"

      - name: Deploy with apply.sh
        env:
          IMAGE_PREFIX: docker.io/library
        run: |
          # A `run:` with no `shell:` is `bash -e` without pipefail, and a
          # failing script piped into tee would otherwise pass; every step
          # below that pipes a script sets it for the same reason.
          set -o pipefail
          IMAGE_TAG="$DEPLOY_TAG" deploy/k3s/apply.sh | tee "$RUNNER_TEMP/apply-1.log"
          # A fresh cluster holds no window, and the patch says so on its line.
          grep -qxF 'ok: close-window patch sent; no canary window was open' "$RUNNER_TEMP/apply-1.log"
          grep -qxF 'ok: smoke passed (steady state)' "$RUNNER_TEMP/apply-1.log"

      - name: Run smoke.sh standalone
        # apply.sh already ran it as its last step. Running it again on its own
        # is the assertion that the rollback check (D25) does not quietly depend
        # on a deploy having just happened in the same shell.
        run: deploy/k3s/smoke.sh

      - name: Node-local loopback reaches the api
        # D34: 127.0.0.1:8000 on the node itself reaches the NodePort through
        # kube-proxy's iptables-mode route_localnet, and is re-verified on any
        # k3s bump. smoke.sh's 127.0.0.1:8000 above is the runner's, carried
        # into the node by the -p mapping; this is the node's own loopback,
        # the address a curl on the EC2 host uses.
        run: |
          set -o pipefail
          docker exec "k3d-${CLUSTER_NAME}-server-0" \
            wget -qO- http://127.0.0.1:8000/health | tee "$RUNNER_TEMP/loopback.json"
          grep -q '"model_loaded":true' "$RUNNER_TEMP/loopback.json"
          echo
          echo "ok: node-local 127.0.0.1:8000 answered /health"

      - name: Open a canary window; smoke is green in it
        # A window is opened the way a human opens one on the host: a merge
        # patch that sets both canary fields (D32). The operator pauses the
        # shadow scorer, observes it gone, then brings the canary up; smoke.sh
        # then judges the window state from the cluster.
        run: |
          set -o pipefail
          kubectl -n mlobs patch servingdeployment/api --type merge \
            -p "{\"spec\":{\"canaryImageTag\":\"${CANARY_TAG}\",\"canaryReplicas\":1}}"
          kubectl -n mlobs wait servingdeployment/api --for=condition=CanaryActive --timeout=60s
          kubectl -n mlobs wait servingdeployment/api --for=condition=ShadowPaused --timeout=180s
          replicas="$(kubectl -n mlobs get statefulset shadow-scorer -o jsonpath='{.spec.replicas}')"
          if [ "$replicas" != 0 ]; then
            echo "::error::the shadow scorer is at ${replicas}, not 0, in an open window"
            exit 1
          fi
          echo "ok: CanaryActive True, shadow scorer at 0"
          # The canary's torch load is the long pole; the state poll waits on it.
          STATE_TIMEOUT_SECONDS=300 deploy/k3s/smoke.sh | tee "$RUNNER_TEMP/smoke-window.log"
          grep -qxF 'ok: smoke passed (window state)' "$RUNNER_TEMP/smoke-window.log"
          docker exec "k3d-${CLUSTER_NAME}-server-0" \
            wget -qO /dev/null http://127.0.0.1:8000/health
          echo "ok: node-local 127.0.0.1:8000 answered /health in the window"

      - name: Smoke rejects a constructed third state
        # D37's two states are all smoke.sh may pass. One that is neither is
        # built here by hand: the operator stopped, so nothing puts it back,
        # and the shadow scorer scaled to 1 beside a serving canary. The
        # operator is then restored, re-pauses the shadow scorer, and the
        # window is green again.
        run: |
          set -o pipefail
          kubectl -n mlobs scale deployment/operator --replicas=0
          deadline=$((SECONDS + 120))
          until [ -z "$(kubectl -n mlobs get pods -l app=operator -o name)" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::the operator pod did not go within 120s"
              exit 1
            fi
            sleep 2
          done
          kubectl -n mlobs scale statefulset/shadow-scorer --replicas=1
          status=0
          STATE_TIMEOUT_SECONDS=30 deploy/k3s/smoke.sh > "$RUNNER_TEMP/smoke-third.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/smoke-third.log"
          if [ "$status" -eq 0 ]; then
            echo "::error::smoke.sh passed a state that is neither steady nor window"
            exit 1
          fi
          if ! grep -qF 'error: the stack is in neither the steady nor the window state' "$RUNNER_TEMP/smoke-third.log"; then
            echo "::error::smoke.sh failed, but not on its state check"
            exit 1
          fi
          echo "ok: smoke.sh rejected the constructed third state"

          kubectl -n mlobs scale deployment/operator --replicas=1
          kubectl -n mlobs rollout status deployment/operator --timeout=180s
          STATE_TIMEOUT_SECONDS=300 deploy/k3s/smoke.sh | tee "$RUNNER_TEMP/smoke-window-2.log"
          grep -qxF 'ok: smoke passed (window state)' "$RUNNER_TEMP/smoke-window-2.log"

      - name: A second apply during the window closes it and converges
        env:
          IMAGE_PREFIX: docker.io/library
        run: |
          set -o pipefail
          # Retag all five rather than one. The image override is a single
          # IMAGE_TAG, so a new tag moves every ref at once — a superset of the
          # one-image case, and a harder convergence test than it.
          for svc in api consumer drift shadow-scorer operator; do
            docker tag "mlobs-${svc}:${DEPLOY_TAG}" "mlobs-${svc}:${REDEPLOY_TAG}"
          done
          k3d image import -c "$CLUSTER_NAME" \
            "mlobs-api:${REDEPLOY_TAG}" "mlobs-consumer:${REDEPLOY_TAG}" \
            "mlobs-drift:${REDEPLOY_TAG}" "mlobs-shadow-scorer:${REDEPLOY_TAG}" \
            "mlobs-operator:${REDEPLOY_TAG}"

          # Edit the scrape config so the ConfigMap regenerates and the pod
          # template's config hash moves. The probe is an external label and not
          # a comment: /api/v1/status/config returns the re-marshalled config and
          # drops comments, as the Prometheus docs state, so a comment-only edit
          # would move the hash but stay invisible at the endpoint asserted on
          # below. An external label survives the round trip. Working tree only;
          # none of this is committed.
          awk '{ print }
               /^global:$/ { print "  external_labels:";
                             print "    ci_convergence_probe: \"" ENVIRON["GITHUB_SHA"] "\"" }' \
            prometheus/prometheus.yml > /tmp/prometheus.yml
          printf '\n# CI convergence probe — working tree only, never committed.\n' \
            >> /tmp/prometheus.yml
          mv /tmp/prometheus.yml prometheus/prometheus.yml
          if ! grep -q 'ci_convergence_probe' prometheus/prometheus.yml; then
            echo "::error::probe was not inserted into the scrape config"
            exit 1
          fi

          hash_before="$(kubectl -n mlobs get deployment prometheus \
            -o jsonpath="{.spec.template.metadata.annotations['mlobs/config-hash']}")"

          started=$SECONDS
          IMAGE_TAG="$REDEPLOY_TAG" deploy/k3s/apply.sh | tee "$RUNNER_TEMP/apply-2.log"
          elapsed=$((SECONDS - started))
          # apply.sh waits on each of the nine workloads with a hard 180s bound
          # and dies if any exceeds it, so reaching this line is itself the
          # convergence assertion. The elapsed figure is evidence, not the test.
          echo "ok: second apply converged in ${elapsed}s (per-workload bound 180s)"

          # The deploy ran while the window was open, so it closed it (D32) on
          # its fixed line, and its own smoke.sh found the stack steady again.
          if ! grep -qxF 'ok: canary window closed by the close-window patch (D32)' "$RUNNER_TEMP/apply-2.log"; then
            echo "::error::the deploy during an open window did not print the close-window fixed line"
            exit 1
          fi
          if ! grep -qxF 'ok: smoke passed (steady state)' "$RUNNER_TEMP/apply-2.log"; then
            echo "::error::the deploy that closed the window did not end in the steady state"
            exit 1
          fi
          echo "ok: the deploy closed the open window on its fixed line and ended steady"

          hash_after="$(kubectl -n mlobs get deployment prometheus \
            -o jsonpath="{.spec.template.metadata.annotations['mlobs/config-hash']}")"
          if [ "$hash_before" = "$hash_after" ]; then
            echo "::error::prometheus config-hash did not move after the scrape config changed"
            exit 1
          fi
          echo "ok: prometheus config-hash moved"

          kubectl -n mlobs port-forward svc/prometheus 9090:9090 >/dev/null 2>&1 &
          pf_pid=$!
          trap 'kill "$pf_pid" 2>/dev/null || true' EXIT
          deadline=$((SECONDS + 30))
          until curl -fsS -o /dev/null "http://127.0.0.1:9090/-/ready" 2>/dev/null; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::prometheus not reachable over port-forward within 30s"
              exit 1
            fi
            sleep 1
          done
          # Read whole, then searched: with pipefail on, a grep -q that exits
          # at its first match could fail the pipe under curl.
          status_config="$(curl -fsS "http://127.0.0.1:9090/api/v1/status/config")"
          if ! grep -q 'ci_convergence_probe' <<<"$status_config"; then
            echo "::error::/api/v1/status/config does not reflect the edited scrape config"
            exit 1
          fi
          echo "ok: /api/v1/status/config reflects the edited scrape config"

      - name: Cluster diagnostics
        if: failure()
        # Only reached on a failure, and only prints cluster state. `describe`
        # renders secret-backed env vars as a reference to the key, never the
        # value, so nothing here can echo credentials — dummy though this job's
        # credentials are.
        run: |
          kubectl -n mlobs get pods -o wide || true
          kubectl -n mlobs get servingdeployment api -o yaml || true
          kubectl -n mlobs get events --sort-by=.lastTimestamp | tail -40 || true
          kubectl -n mlobs describe pods | tail -160 || true
          kubectl -n mlobs logs deployment/api --tail=50 || true
          kubectl -n mlobs logs deployment/api -c redis-ready --tail=10 || true
          kubectl -n mlobs logs deployment/operator --tail=80 || true
          kubectl -n kube-system get pods -o wide || true
          kubectl -n kube-system logs deployment/coredns --tail=40 || true
          docker exec "k3d-${CLUSTER_NAME}-server-0" iptables -S FORWARD || true
          docker logs "k3d-${CLUSTER_NAME}-server-0" 2>&1 \
            | grep -iE 'error|fail|netpol|network polic|flannel|proxy' | tail -60 || true

      - name: Disk report
        if: always()
        run: df -h /

      - name: Delete cluster
        if: always()
        run: k3d cluster delete "$CLUSTER_NAME" || true

  OperatorE2E:
    name: operator e2e (k3d, stub image)
    # Phase 3 O2 (D35): the operator on its own, on the k3d image K3sSmoke
    # pins, with a stub in place of the torch api — leader election and the
    # reconcile mechanics, no smoke. operator/hack/e2e.sh is the whole check
    # and runs the same against a local k3d cluster; this job only builds and
    # imports what it needs. The cluster is started WITHOUT the D34 flag pair,
    # on purpose: the script's first assertion is that apply.sh's preflight
    # refuses a default node-port range, on its fixed line, before it changes
    # anything, and that runs here against the real pinned k3s. Nothing below
    # sets the range, so the pair's other half has no place here either.
    #
    # Since Phase 3 H1 (D38) the script installs the operator twice on this
    # one cluster: from the flattened manifests, then, once that install is
    # taken down to its CRD, from the chart at deploy/helm/mlobs-operator with
    # `helm install -n mlobs` at the same prefix and tag, with the same
    # assertions. Helm is pinned here exactly as in operator.yml's HelmParity;
    # the two pins move together.
    #
    # Gated by the same path filter as K3sSmoke, and credential-less like it.
    needs: K3sPaths
    if: needs.K3sPaths.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: operator-e2e-${{ github.ref }}
      cancel-in-progress: true
    env:
      K3D_VERSION: v5.9.0
      K3S_IMAGE: rancher/k3s:v1.36.4-k3s1
      CLUSTER_NAME: mlobs-e2e
      IMAGE_PREFIX: docker.io/library
      IMAGE_TAG: ${{ github.sha }}
      HELM_VERSION: v3.22.0
      HELM_SHA256: 1e4ab49e429626cf6c6958d914248b78c9730803c2751b87627e171dc800e7bb
    steps:
      - uses: actions/checkout@v7

      - name: Install k3d
        # The same pinned release asset as K3sSmoke.
        run: |
          curl -fsSL -o /tmp/k3d \
            "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          sudo install -m 0755 /tmp/k3d /usr/local/bin/k3d
          k3d version

      - name: Install Helm (pinned)
        # The same pinned release asset and checksum as HelmParity.
        run: |
          curl -fsSL --retry 2 -o "${RUNNER_TEMP}/helm.tar.gz" \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  ${RUNNER_TEMP}/helm.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/helm.tar.gz" -C "$RUNNER_TEMP" linux-amd64/helm
          sudo install -m 0755 "${RUNNER_TEMP}/linux-amd64/helm" /usr/local/bin/helm
          version="$(helm version --template '{{.Version}}')"
          if [ "$version" != "$HELM_VERSION" ]; then
            echo "::error::helm reports ${version}, expected ${HELM_VERSION} (D38)"
            exit 1
          fi
          echo "ok: helm ${version}"

      - name: Create k3d cluster
        # The host's add-ons disabled as in K3sSmoke; the node-port range left
        # at its default, as explained above.
        run: |
          k3d cluster create "$CLUSTER_NAME" \
            --image "$K3S_IMAGE" \
            --k3s-arg '--disable=traefik@server:*' \
            --k3s-arg '--disable=servicelb@server:*' \
            --k3s-arg '--disable=metrics-server@server:*' \
            --wait \
            --timeout 300s
          kubectl wait --for=condition=Ready node --all --timeout=120s

      - name: Build and import the operator and the stub
        run: |
          canary_tag="$(printf '%s' "${IMAGE_TAG}-canary" | sha1sum | cut -c1-40)"
          echo "CANARY_TAG=${canary_tag}" >> "$GITHUB_ENV"
          docker build -t "mlobs-operator:${IMAGE_TAG}" operator
          docker build -t mlobs-stub:e2e - < operator/hack/e2e-stub.Dockerfile
          docker tag mlobs-stub:e2e "mlobs-api:${IMAGE_TAG}"
          docker tag mlobs-stub:e2e "mlobs-api:${canary_tag}"
          k3d image import -c "$CLUSTER_NAME" \
            "mlobs-operator:${IMAGE_TAG}" mlobs-stub:e2e \
            "mlobs-api:${IMAGE_TAG}" "mlobs-api:${canary_tag}"

      - name: Operator end-to-end
        run: operator/hack/e2e.sh

      - name: Cluster diagnostics
        if: failure()
        run: |
          kubectl -n mlobs get all -o wide || true
          kubectl -n mlobs get servingdeployment api -o yaml || true
          kubectl -n mlobs get events --sort-by=.lastTimestamp | tail -40 || true
          kubectl -n mlobs logs deployment/operator --tail=100 || true
          helm list --all-namespaces --all || true

      - name: Delete cluster
        if: always()
        run: k3d cluster delete "$CLUSTER_NAME" || true

  RollbackRehearsal:
    name: D36 rollback rehearsal (k3d)
    # Phase 3 O3 (D36): undoing the operator, rehearsed in D36's order before
    # O4 needs it on the host. deploy/k3s/rehearse-rollback.sh is the whole
    # check and runs the same against a local k3d cluster; this job only
    # builds and imports what it needs. The script deploys the pre-cutover
    # tree through that tree's own apply.sh, cuts over to this one the way
    # #68 will on the host, so that the operator adopts deployment/api in
    # place, and opens a canary window. Then it runs D36's six steps — canary
    # to 0 by host patch, the ServingDeployment deleted, deployment/api
    # garbage-collected to a bound, the operator scaled to 0, the pre-cutover
    # tree redeployed through its own apply.sh, its smoke.sh green — and
    # asserts each on the cluster state it leaves: conditions, replica
    # counts, owners and uids, and the scripts' fixed lines.
    #
    # PRE_CUTOVER_SHA stands for the SHA the host runs before O4's cutover:
    # 16a8c86, the last deploy on record in the Deploy workflow's history.
    # If O4 records a different pre-cutover SHA, this pin moves with it.
    #
    # The cluster is K3sSmoke's, D34 pair included: the pre-cutover tree has
    # to come back on a k3s that already carries the flags, because the host
    # keeps them after a rollback. Gated by K3sPaths' `rehearsal` output, and
    # credential-less like K3sSmoke: images built locally, never pushed.
    needs: K3sPaths
    if: needs.K3sPaths.outputs.rehearsal == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: rollback-rehearsal-${{ github.ref }}
      cancel-in-progress: true
    env:
      K3D_VERSION: v5.9.0
      K3S_IMAGE: rancher/k3s:v1.36.4-k3s1
      CLUSTER_NAME: mlobs-rollback
      IMAGE_PREFIX: docker.io/library
      IMAGE_TAG: ${{ github.sha }}
      PRE_CUTOVER_SHA: 16a8c860af1fdc89bb7db96f497aeb542e1b40c9
    steps:
      - uses: actions/checkout@v7
        with:
          # The script extracts the pre-cutover tree from history with
          # `git archive`, so the history has to be here.
          fetch-depth: 0

      - name: Derive the canary tag
        run: |
          canary_tag="$(printf '%s' "${IMAGE_TAG}-canary" | sha1sum | cut -c1-40)"
          echo "CANARY_TAG=${canary_tag}" >> "$GITHUB_ENV"
          echo "ok: pre-cutover ${PRE_CUTOVER_SHA}, deploy ${IMAGE_TAG}, canary ${canary_tag}"

      - name: Reclaim runner disk
        # As in K3sSmoke: two torch images, each stored twice.
        run: |
          before=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          sudo rm -rf /usr/local/lib/android       # Android SDK and NDK
          sudo rm -rf /usr/share/dotnet            # .NET SDK
          sudo rm -rf /opt/ghc /usr/local/.ghcup   # Haskell: GHC, Stack, ghcup
          sudo rm -rf /usr/share/swift             # Swift toolchain
          sudo rm -rf /usr/local/share/powershell  # PowerShell
          after=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "ok: reclaimed $((after - before))G, ${after}G now free"

      - name: Assert free disk
        run: |
          avail=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          if [ "$avail" -lt 8 ]; then
            echo "::error::only ${avail}G free — the five image builds need more"
            exit 1
          fi
          echo "ok: ${avail}G free (>= 8G)"

      - name: Install k3d
        # The same pinned release asset as K3sSmoke.
        run: |
          curl -fsSL -o /tmp/k3d \
            "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          sudo install -m 0755 /tmp/k3d /usr/local/bin/k3d
          k3d version

      - name: Load br_netfilter on the runner
        # As in K3sSmoke: with network policy off, the other half of the D34
        # pair, nothing inside a k3d node loads it, and no pod reaches a
        # Service without it.
        run: |
          sudo modprobe br_netfilter
          test -e /proc/sys/net/bridge/bridge-nf-call-iptables
          echo "ok: br_netfilter loaded; bridge-nf-call-iptables=$(cat /proc/sys/net/bridge/bridge-nf-call-iptables)"

      - name: Create k3d cluster
        # K3sSmoke's cluster, flag for flag: the host's add-ons disabled, the
        # D34 pair, and the api's port and grafana's published where smoke.sh
        # looks. The pre-cutover tree's hostPort 8000 is reached through the
        # same -p mapping as the NodePort after it.
        run: |
          k3d cluster create "$CLUSTER_NAME" \
            --image "$K3S_IMAGE" \
            -p '8000:8000@server:0' \
            -p '3000:3000@server:0' \
            --k3s-arg '--disable=traefik@server:*' \
            --k3s-arg '--disable=servicelb@server:*' \
            --k3s-arg '--disable=metrics-server@server:*' \
            --k3s-arg '--service-node-port-range=8000-8000@server:*' \
            --k3s-arg '--disable-network-policy@server:*' \
            --wait \
            --timeout 300s
          kubectl wait --for=condition=Ready node --all --timeout=120s

      - name: Cluster DNS and Service routing answer
        # K3sSmoke's early check: a pod resolves a Service by name and opens
        # it, so a routing fault fails here rather than minutes into a deploy.
        run: |
          kubectl -n kube-system rollout status deployment/coredns --timeout=180s
          kubectl run net-probe --namespace default --image=busybox:1.37 --restart=Never \
            --command -- sh -c 'nslookup kubernetes.default.svc.cluster.local && nc -z -w 5 kubernetes.default.svc.cluster.local 443'
          if ! kubectl wait --namespace default pod/net-probe \
                --for=jsonpath='{.status.phase}'=Succeeded --timeout=120s; then
            kubectl --namespace default logs pod/net-probe || true
            echo "::error::a pod could not resolve and reach a Service by name"
            exit 1
          fi
          kubectl --namespace default delete pod/net-probe --wait=false
          echo "ok: cluster DNS resolves Service names and Service routing reaches the endpoint"

      - name: Build service images
        # One build of each image, under this commit's tag; the pre-cutover
        # tag and the canary tag name the same builds. The pre-cutover tree is
        # deployed with these because every input its Dockerfiles copy —
        # docker/, src/ and requirements/ — is the same in both trees, which
        # the last lines check and say. If that stops being true, the run
        # says so in a notice: the rehearsal then deploys the old manifests
        # with this commit's images, which still rehearses the boundary D36
        # crosses — owners, Services, the operator — but not the old images.
        run: |
          docker build -f docker/api.Dockerfile           -t "mlobs-api:${IMAGE_TAG}" .
          docker build -f docker/consumer.Dockerfile      -t "mlobs-consumer:${IMAGE_TAG}" .
          docker build -f docker/drift.Dockerfile         -t "mlobs-drift:${IMAGE_TAG}" .
          docker build -f docker/shadow_scorer.Dockerfile -t "mlobs-shadow-scorer:${IMAGE_TAG}" .
          docker build -t "mlobs-operator:${IMAGE_TAG}" operator
          for svc in api consumer drift shadow-scorer; do
            docker tag "mlobs-${svc}:${IMAGE_TAG}" "mlobs-${svc}:${PRE_CUTOVER_SHA}"
          done
          docker tag "mlobs-api:${IMAGE_TAG}" "mlobs-api:${CANARY_TAG}"
          docker images --filter reference='mlobs-*' \
            --format '{{.Repository}}:{{.Tag}} {{.Size}}'
          if git diff --quiet "$PRE_CUTOVER_SHA" HEAD -- docker src requirements; then
            echo "ok: docker/, src/ and requirements/ unchanged since ${PRE_CUTOVER_SHA}: these builds are that tree's images"
          else
            echo "::notice::docker/, src/ or requirements/ changed since ${PRE_CUTOVER_SHA}: the pre-cutover tag carries this commit's builds"
          fi

      - name: Prune build cache
        run: |
          docker builder prune -f
          df -h /

      - name: Import images into the cluster
        run: |
          k3d image import -c "$CLUSTER_NAME" \
            "mlobs-api:${IMAGE_TAG}" "mlobs-consumer:${IMAGE_TAG}" \
            "mlobs-drift:${IMAGE_TAG}" "mlobs-shadow-scorer:${IMAGE_TAG}" \
            "mlobs-operator:${IMAGE_TAG}" \
            "mlobs-api:${PRE_CUTOVER_SHA}" "mlobs-consumer:${PRE_CUTOVER_SHA}" \
            "mlobs-drift:${PRE_CUTOVER_SHA}" "mlobs-shadow-scorer:${PRE_CUTOVER_SHA}" \
            "mlobs-api:${CANARY_TAG}"

      - name: Rehearse the D36 rollback
        run: deploy/k3s/rehearse-rollback.sh

      - name: Cluster diagnostics
        if: failure()
        # Cluster state only; `describe` renders secret-backed env vars as a
        # reference to the key, never the value.
        run: |
          kubectl -n mlobs get all -o wide || true
          kubectl -n mlobs get servingdeployment api -o yaml || true
          kubectl -n mlobs get events --sort-by=.lastTimestamp | tail -60 || true
          kubectl -n mlobs describe deployment api || true
          kubectl -n mlobs describe pods -l app=api | tail -80 || true
          kubectl -n mlobs logs deployment/operator --tail=100 || true
          kubectl -n mlobs get service api -o yaml || true

      - name: Disk report
        if: always()
        run: df -h /

      - name: Delete cluster
        if: always()
        run: k3d cluster delete "$CLUSTER_NAME" || true

  GhcrPublish:
    name: Publish images to GHCR
    # Phase 2 P2a: the registry half of the deploy story (D18). Pushes the
    # service images to GHCR under two tags — the immutable commit SHA, which is
    # what a deploy actually pins, and a moving `main` that names the current
    # tip for a human reading `docker pull`.
    #
    # Main pushes only, doubly. The workflow's `on: push:` is already filtered to
    # `branches: [main]`, so a push to any other branch never starts this
    # workflow at all; the condition below then rules out the two other events
    # that DO start it — every pull_request, and a workflow_dispatch on an
    # arbitrary branch. Publishing is a write to a public registry, so it is
    # worth being unable to reach it by accident rather than merely unlikely to.
    #
    # Gated on the k3d rehearsal: a main push must not publish images whose
    # deploy rehearsal failed. On GitHub's semantics a bare `needs: K3sSmoke`
    # would already hold this job back after a failed rehearsal — a job whose
    # needs failed is skipped — and an `if:` with no status function is ANDed
    # with an implicit success(). The result is still tested explicitly: the
    # condition then states everything it requires in the one place it is
    # read, and it keeps doing so if a later edit adds always() or another
    # status function here, which would drop the implicit success().
    needs: K3sSmoke
    if: needs.K3sSmoke.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Naming any permission replaces the whole inherited set, so contents: read
    # is restated alongside packages: write — without it checkout cannot read the
    # repository. `packages: write` is the only elevation, and it is scoped to
    # this job rather than the workflow.
    permissions:
      contents: read
      packages: write
    # Its own group, and deliberately without cancel-in-progress: the
    # workflow-wide group cancels on a newer push, and a publish cancelled
    # part-way could leave the moving `main` tag pointing at neither the old nor
    # the new build. Per-service so the four run in parallel.
    concurrency:
      group: ghcr-publish-${{ matrix.service }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      # Four images, not five. shadow-scorer is absent on purpose: the model it
      # bakes is published on Hugging Face with no upstream licence stated, so
      # republishing those weights inside a container image on a public registry
      # is a redistribution this repository declines to make (owner ruling
      # 2026-09-10, D18). The posture is that the weights stay where their
      # author put them, fetched verbatim at build time; the image itself moves
      # as a private S3 tarball in P2c, with a local build plus scp as the
      # interim in P2b. The operator joined in Phase 3 O2: apply.sh deploys it
      # at the same per-SHA tag as the rest (03-operator.yaml), and its build
      # context is its own module directory.
      matrix:
        include:
          - service: api
            dockerfile: docker/api.Dockerfile
            context: .
          - service: consumer
            dockerfile: docker/consumer.Dockerfile
            context: .
          - service: drift
            dockerfile: docker/drift.Dockerfile
            context: .
          - service: operator
            dockerfile: operator/Dockerfile
            context: operator
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        # GITHUB_TOKEN, not a personal access token: it is minted per run,
        # expires with it, and carries exactly the packages: write granted
        # above. No third-party action is involved in handling it, and it
        # reaches docker over stdin rather than as an argument or a flag value.
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          echo "ok: logged in to ghcr.io"

      - name: Build and push
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          CONTEXT: ${{ matrix.context }}
          IMAGE: ghcr.io/muratalkan06/mlobs-${{ matrix.service }}
          SHA_TAG: ${{ github.sha }}
        run: |
          docker build -f "$DOCKERFILE" -t "${IMAGE}:${SHA_TAG}" -t "${IMAGE}:main" "$CONTEXT"
          docker push "${IMAGE}:${SHA_TAG}"
          docker push "${IMAGE}:main"
          echo "ok: pushed ${IMAGE}:${SHA_TAG}"
          echo "ok: pushed ${IMAGE}:main"

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  ShadowPublish:
    name: Publish shadow image to S3
    # Phase 2 P2c: the image GhcrPublish leaves out (D18, D28). The model the
    # shadow scorer bakes is published on Hugging Face with no upstream licence
    # stated, so the image never goes to a public registry (owner ruling
    # 2026-09-10). It is saved as a tarball and uploaded to a private S3 bucket
    # instead — encrypted, public access blocked, and readable, among this
    # repository's roles, only by the host's instance role (the deploy role
    # can list the keys, not read them) — so nothing this job does makes the
    # image, or the weights inside it, publicly retrievable.
    #
    # Gated as GhcrPublish is: main pushes only, and only after the k3d
    # rehearsal succeeded. On GitHub's semantics a bare `needs: K3sSmoke`
    # would already hold this job back after a failed rehearsal — a job whose
    # needs failed is skipped — and an `if:` with no status function is ANDed
    # with an implicit success(). The result is still tested explicitly: the
    # condition then states everything it requires in the one place it is
    # read, and it keeps doing so if a later edit adds always() or another
    # status function here, which would drop the implicit success().
    #
    # SHA-pinned actions, as in TerraformPlan: this job holds an AWS session.
    # It is mlobs-artifact-publish's, whose only grant is s3:PutObject under
    # shadow/ in the artifacts bucket (infra/ec2/deploy.tf).
    #
    # The environment is how that role is reached: the role trusts only the
    # OIDC subject of the `shadow-publish` environment, not the main-branch
    # subject every job on main is issued, and the environment admits only
    # runs on main. The environment has no reviewer, so publishing never
    # waits. It must exist, with its branch rule, before the role does
    # (infra/README.md, "Deploy pipeline"): GitHub creates a referenced
    # environment that does not exist, with no rules at all.
    #
    # No job-level concurrency group, unlike GhcrPublish. That group protects
    # the moving `main` tag; every key written here is a commit SHA, written
    # once, so two runs never touch the same object. A group would only let a
    # newer pending run replace an older one and leave that commit with no
    # tarball to deploy. A run cancelled mid-upload leaves no object at all —
    # S3 publishes an upload whole or not — and the deploy preflight says so.
    needs: K3sSmoke
    if: needs.K3sSmoke.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: shadow-publish
    # Naming any permission replaces the inherited set, so contents: read is
    # restated beside id-token: write, the OIDC token request.
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ghcr.io/muratalkan06/mlobs-shadow-scorer
      SHA_TAG: ${{ github.sha }}
      ARTIFACTS_BUCKET: mlobs-artifacts-601548053958
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build needs the files, not git access: no token is left in
          # .git/config for a later step to find.
          persist-credentials: false

      - name: Build shadow-scorer image
        # Named for GHCR although it is never pushed there. `docker save`
        # records this name in the tarball, `k3s ctr images import` restores it
        # on the host, and it is exactly the ref the shadow-scorer manifest
        # renders at IMAGE_TAG=<sha> under apply.sh's default IMAGE_PREFIX.
        # imagePullPolicy: IfNotPresent then finds it locally, so the kubelet
        # never asks GHCR for an image GHCR does not have.
        run: docker build -f docker/shadow_scorer.Dockerfile -t "${IMAGE}:${SHA_TAG}" .

      - name: Save image tarball
        # pipefail is explicit because a `run:` with no `shell:` is `bash -e`
        # without it, and a failed `docker save` would otherwise hand gzip an
        # empty stream and upload a valid, empty archive.
        run: |
          set -o pipefail
          docker save "${IMAGE}:${SHA_TAG}" | gzip > "${RUNNER_TEMP}/shadow.tar.gz"
          bytes=$(stat -c %s "${RUNNER_TEMP}/shadow.tar.gz")
          echo "ok: saved ${IMAGE}:${SHA_TAG} (${bytes} bytes gzipped)"

      # Credentials are requested only now, after the build: the Dockerfile's
      # package installs run while this job holds no AWS session at all.
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: arn:aws:iam::601548053958:role/mlobs-artifact-publish
          aws-region: us-west-2

      - name: Upload to S3
        run: |
          key="shadow/${SHA_TAG}.tar.gz"
          aws s3 cp --no-progress "${RUNNER_TEMP}/shadow.tar.gz" "s3://${ARTIFACTS_BUCKET}/${key}"
          echo "ok: uploaded s3://${ARTIFACTS_BUCKET}/${key}"
