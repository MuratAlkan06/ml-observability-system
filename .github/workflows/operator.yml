name: Operator

# Phase 3 O0: lint, envtest and the manifest sync check for the Go operator
# module under operator/ (docs/PLAN.md D31, D35). A workflow of its own rather
# than three more jobs in ci.yml, because GitHub applies `paths:` per workflow:
# none of these jobs has anything to say about a change that touches neither
# the module nor the manifests it generates, and a workflow-level filter is the
# only filter that skips them outright. The operator's end-to-end runs on k3d
# belong to ci.yml, not here (D35): OperatorE2E and K3sSmoke, behind the
# K3sPaths filter there.
#
# Phase 3 H1 added the operator chart's two checks, HelmParity and HelmLint,
# and deploy/helm/ to the paths below (D38). The chart is a projection of the
# flattened manifests this workflow already guards, so a change on either
# side runs both.
#
# Govulncheck joined from the deferral register (#60, D51): the module's
# source scanned against the Go vulnerability database, behind the same paths.

on:
  push:
    branches: [main]
    paths:
      - "operator/**"
      - "deploy/k3s/manifests/**"
      - "deploy/helm/**"
      - ".github/workflows/operator.yml"
  pull_request:
    paths:
      - "operator/**"
      - "deploy/k3s/manifests/**"
      - "deploy/helm/**"
      - ".github/workflows/operator.yml"
  workflow_dispatch:

# No job here holds a credential of any kind — nothing is pushed and nothing
# touches AWS — so read access to the repository is the whole grant, and the
# actions are tag-pinned like the other credential-less jobs (see K3sSmoke).
permissions:
  contents: read

concurrency:
  group: operator-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: operator

# Helm, pinned to an exact 3.x patch and to its release checksum (D38): the
# parity is byte-level, so the renderer is pinned like a compiler. The same
# pin as OperatorE2E in ci.yml; the two move together, and a Helm 4 move is a
# named revisit, never a silent drift.
env:
  HELM_VERSION: v3.22.0
  HELM_SHA256: 1e4ab49e429626cf6c6958d914248b78c9730803c2751b87627e171dc800e7bb

jobs:
  GoLint:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # go-version-file honours go.mod's `toolchain` line over its `go` line,
      # so CI builds with exactly the toolchain the module pins.
      - uses: actions/setup-go@v7
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum
      # The action finds operator/.custom-gcl.yml and builds the custom binary
      # with the logcheck plugin itself. `version` must equal the one pinned in
      # that file, or the action warns and the two can drift apart.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: operator

  GoTest:
    name: Go test (envtest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum
      - name: Go toolchain
        run: go version

      - name: Build
        run: go build ./...

      # setup-envtest is installed at the controller-runtime version go.mod
      # resolves (v0.24.x), through the Makefile's own pin, and the assets are
      # the 1.36.x band the host's k3s v1.36.4 sits in (D19, D35). The version
      # the kube-apiserver binary reports is asserted, not assumed: a wildcard
      # that resolved outside the band would otherwise pass unnoticed.
      - name: Install envtest assets (1.36.x)
        run: |
          make envtest
          assets="$(bin/setup-envtest use 1.36.x --bin-dir bin -p path)"
          assets="$(cd "$assets" && pwd)"
          version="$("${assets}/kube-apiserver" --version)"
          case "$version" in
            "Kubernetes v1.36."*) ;;
            *)
              echo "::error::envtest kube-apiserver reports '${version}', expected v1.36.x (D35)"
              exit 1
              ;;
          esac
          echo "KUBEBUILDER_ASSETS=${assets}" >> "$GITHUB_ENV"
          echo "ok: envtest assets ${assets} (${version})"

      - name: Test
        run: go test ./... -count=1

  Govulncheck:
    name: Govulncheck
    # Source-mode govulncheck over the module (#60, D51). The scan writes JSON,
    # in which govulncheck exits 0 whatever it finds, and the step after it
    # decides. It fails on a called (symbol-level) finding whose OSV ID is not
    # on the accepted list there, and warns, never fails, when an accepted ID
    # is no longer called, so a stale entry surfaces for pruning. Package- and
    # module-level findings are printed and do not fail the job. The scanner is
    # pinned to an exact version and fetched through the module proxy and the
    # checksum database. The database it reads is live, so a new advisory can
    # turn this job red with no change in the repository, though only at its
    # next run: it has no schedule, and runs only on the workflow's paths
    # filter and on manual dispatch. The standard library it checks is the
    # builder image's (#143): the Go version is derived at run time from
    # operator/Dockerfile's builder tag, and the scan runs under
    # GOTOOLCHAIN=local and CGO_ENABLED=0, mirroring the build. A builder bump
    # moves the scan with it, and a bump of go.mod's toolchain line alone
    # cannot leave it green against a standard library the shipped binary does
    # not carry.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The pattern is anchored and must match exactly one line, so a builder
      # line that is removed, duplicated or reworded fails here instead of
      # handing setup-go some other version.
      - name: Builder Go version (operator/Dockerfile)
        id: builder-go
        run: |
          pattern='^FROM golang:([0-9]+\.[0-9]+\.[0-9]+)@sha256:[0-9a-f]{64} AS builder$'
          count="$(grep -cE "$pattern" Dockerfile || true)"
          line="$(grep -E "$pattern" Dockerfile || true)"
          if [ "$count" != "1" ] || ! [[ "$line" =~ $pattern ]]; then
            echo "::error::operator/Dockerfile has ${count:-no} lines matching the builder pattern, expected exactly one (#143)"
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "ok: builder Go ${version} (operator/Dockerfile)"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.builder-go.outputs.version }}
          cache-dependency-path: operator/go.sum
      # GOTOOLCHAIN=local keeps go from switching to go.mod's toolchain line,
      # which would defeat the pin; both variables mirror the builder's build.
      # The literal match with its trailing space keeps 1.26.90 from passing
      # for 1.26.9.
      - name: Scan (source mode, JSON)
        env:
          BUILDER_GO: ${{ steps.builder-go.outputs.version }}
          GOTOOLCHAIN: local
          CGO_ENABLED: "0"
        run: |
          got="$(go version)"
          if [ -z "$BUILDER_GO" ] || [[ "$got" != *"go${BUILDER_GO} "* ]]; then
            echo "::error::go version reports '${got}', expected go${BUILDER_GO} from operator/Dockerfile (#143)"
            exit 1
          fi
          echo "ok: ${got}"
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -format json ./... \
            > "${RUNNER_TEMP}/govulncheck.json"
      - name: Classify findings against the accepted list
        run: |
          # Each entry was rated against the shipped binary and accepted on #60
          # (comment 6098416055, section 2), and is retired by the named cleanup
          # version once the k8s.io dependencies carry it (D51).
          accepted=(
            GO-2026-6061 # grpc: rated None on #60, item 4; retired by grpc-go v1.82.1
            GO-2026-6348 # grpc: rated None on #60, item 3; retired by grpc-go v1.83.1
            GO-2026-6505 # otel: rated None on #60, item 1; retired by otel/sdk and the otlptrace exporters at v1.45.0
          )
          report="${RUNNER_TEMP}/govulncheck.json"

          # The runner reads a workflow command (::error::, ::warning:: and the
          # rest) from any line of this log, and the report's text is the
          # database's: a summary with a newline in it could forge one. So each
          # string jq prints here goes through esc, the runner's encoding of a
          # command's message (% first, then CR and LF), and stays on one line.
          esc='def esc: tostring | gsub("%";"%25") | gsub("\r";"%0D") | gsub("\n";"%0A");'

          # A report that is not a symbol-level scan holds no called findings
          # to judge, and would pass on warnings alone.
          level="$(jq -r "${esc}"' select(.config) | .config.scan_level | esc' "$report")"
          if [ "$level" != "symbol" ]; then
            echo "::error::govulncheck report has scan_level '${level}', expected symbol (D51)"
            exit 1
          fi
          jq -r "${esc}"' select(.config) | .config
            | "scanner: \(.scanner_name) \(.scanner_version), \(.go_version), \(.scan_mode) mode; db \(.db), modified \(.db_last_modified)" | esc' "$report"

          # One line per OSV ID at its most precise level: 2 called (the first
          # trace frame names a function), 1 imported (a package, no function),
          # 0 required (the module alone).
          findings="$(jq -r -s "${esc}"'
            [.[] | select(.finding) | .finding
              | {osv, module: "\(.trace[0].module)@\(.trace[0].version)",
                 rank: (if (.trace[0].function // "") != "" then 2
                        elif (.trace[0].package // "") != "" then 1
                        else 0 end)}]
            | group_by(.osv)[]
            | "\(.[0].osv) \(map(.rank) | max) \(map(.module) | unique | join(","))" | esc' "$report")"

          declare -A is_accepted=() is_called=() is_reported=()
          for id in "${accepted[@]}"; do is_accepted[$id]=1; done
          status=0
          while read -r id rank modules; do
            [ -n "$id" ] || continue
            is_reported[$id]=1
            case "$rank" in
              2)
                is_called[$id]=1
                if [ -n "${is_accepted[$id]:-}" ]; then
                  echo "called, accepted on #60: ${id} in ${modules}"
                else
                  # The report can repeat an ID's entry; one summary is printed.
                  summary="$(jq -r -s --arg id "$id" "${esc}"'
                    first(.[] | select(.osv) | .osv | select((.id | esc) == $id)) | .summary | esc' "$report")"
                  echo "::error::called finding ${id} in ${modules} is not on the accepted list (D51): ${summary}"
                  status=1
                fi
                ;;
              1) echo "informational, imported but not called: ${id} in ${modules}" ;;
              *) echo "informational, required but not imported: ${id} in ${modules}" ;;
            esac
          done <<< "$findings"

          for id in "${accepted[@]}"; do
            [ -z "${is_called[$id]:-}" ] || continue
            if [ -n "${is_reported[$id]:-}" ]; then
              where="is reported only below the called level"
            else
              where="is no longer in the scanner output"
            fi
            echo "::warning::accepted ${id} ${where}; prune it from the accepted list (D51)"
          done

          if [ "$status" -ne 0 ]; then
            echo "Rate each new called finding on #60 and accept it here with its citation, or move the dependency."
            echo "Call traces: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./... in operator/"
          fi
          exit "$status"

  OperatorManifestSync:
    name: Operator manifest sync
    # The CRD and the Role under deploy/k3s/manifests/ are controller-gen output
    # spliced below a marker line; this regenerates them into a scratch
    # directory and fails on any diff (D31). It is the check that stands in for
    # the kustomize tree the scaffold came with. Since H1 it holds a third
    # projection of the same Go source to the same bytes: the operator chart's
    # crds/ copy, whole-file, and fails if crds/ holds any other file (D38).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum
      - name: Verify flattened manifests
        run: make verify-manifests

  HelmParity:
    name: Helm chart parity
    # Phase 3 H1 (D38): the operator chart against the flattened manifests it
    # packages, which stay the authority. operator/hack/helm-parity.sh is the
    # whole check and runs the same on a laptop: `helm template -n mlobs` at a
    # sentinel prefix and a 40-hex sentinel tag, without --include-crds (the
    # CRD is OperatorManifestSync's), against 02-operator-rbac.yaml and
    # 03-operator.yaml with IMAGE_PREFIX and IMAGE_TAG sed-rendered to the
    # same sentinels. Only Helm's `# Source:` lines are removed, and every
    # document must match byte for byte; the script's header explains why the
    # documents are compared in a canonical order rather than Helm's. Then one
    # negative render per guard, each asserted on its fixed line: a non-40-hex
    # image.tag, and a release namespace other than mlobs. It also fails on
    # any ServingDeployment under deploy/helm/.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Helm (pinned)
        run: |
          curl -fsSL --retry 2 -o "${RUNNER_TEMP}/helm.tar.gz" \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  ${RUNNER_TEMP}/helm.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/helm.tar.gz" -C "$RUNNER_TEMP" linux-amd64/helm
          sudo install -m 0755 "${RUNNER_TEMP}/linux-amd64/helm" /usr/local/bin/helm
          version="$(helm version --template '{{.Version}}')"
          if [ "$version" != "$HELM_VERSION" ]; then
            echo "::error::helm reports ${version}, expected ${HELM_VERSION} (D38)"
            exit 1
          fi
          echo "ok: helm ${version}"
      - name: Chart parity and guard refusals
        run: operator/hack/helm-parity.sh

  HelmLint:
    name: Helm chart lint
    # `helm lint` on the pinned Helm, invoked like every render path with -n
    # mlobs and the sentinel values (D38); without them the guards fail the
    # lint, by design. Not --strict, and that is the acceptance D38 states:
    # lint's recommended-label warnings are accepted, because
    # app.kubernetes.io/* labels on the templates would break byte-parity
    # with the flattened manifests. At the 3.22.0 pin lint raises no warning
    # for this chart; its one finding, "[INFO] Chart.yaml: icon is
    # recommended", is accepted too. An error still fails the job.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      SENTINEL_PREFIX: sentinel.invalid/helm-parity
      SENTINEL_TAG: deadbeefdeadbeefdeadbeefdeadbeefdeadbeef
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Helm (pinned)
        run: |
          curl -fsSL --retry 2 -o "${RUNNER_TEMP}/helm.tar.gz" \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  ${RUNNER_TEMP}/helm.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/helm.tar.gz" -C "$RUNNER_TEMP" linux-amd64/helm
          sudo install -m 0755 "${RUNNER_TEMP}/linux-amd64/helm" /usr/local/bin/helm
          version="$(helm version --template '{{.Version}}')"
          if [ "$version" != "$HELM_VERSION" ]; then
            echo "::error::helm reports ${version}, expected ${HELM_VERSION} (D38)"
            exit 1
          fi
          echo "ok: helm ${version}"
      - name: Lint
        run: |
          helm lint deploy/helm/mlobs-operator --namespace mlobs \
            --set image.prefix="$SENTINEL_PREFIX" --set image.tag="$SENTINEL_TAG"
