version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/requirements"
    schedule:
      interval: "weekly"
    groups:
      pip-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # transformers and tokenizers are exact-pinned and COUPLED (docs/PLAN.md §1
    # erratum): transformers 5.13.1 caps tokenizers<=0.23.0, so any lone bump is
    # uninstallable — Dependabot PR #13 (tokenizers 0.22.2 -> 0.23.1) failed the
    # DockerBuild job for exactly this reason. Bump the pair manually, together.
    ignore:
      - dependency-name: "transformers"
      - dependency-name: "tokenizers"

  # infra/ec2 pins the AWS provider to a minor band (~> 6.33) and records exact
  # build hashes in .terraform.lock.hcl, so this ecosystem is what keeps the
  # lock moving. A 6.x bump lands as a reviewable PR that TerraformValidate
  # checks; a 7.x major cannot arrive this way and needs a deliberate edit to
  # versions.tf. Dependabot PRs are skipped by TerraformPlan, whose token
  # cannot assume the AWS role.
  - package-ecosystem: "terraform"
    directory: "/infra/ec2"
    schedule:
      interval: "weekly"

  # The operator module (Phase 3). k8s.io and controller-runtime are held in
  # the band that matches the host's k3s v1.36.4 — k8s.io at v0.36.x,
  # controller-runtime at v0.24.x — and envtest runs on 1.36.x to match. Patch
  # releases inside the band arrive here as usual; the band itself is released
  # only together with a k3s bump recorded as a D19 erratum, so a new minor
  # never arrives as a Dependabot PR (docs/PLAN.md D35).
  - package-ecosystem: "gomod"
    directory: "/operator"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "k8s.io/*"
        versions: [">= 0.37.0"]
      - dependency-name: "sigs.k8s.io/controller-runtime"
        versions: [">= 0.25.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
